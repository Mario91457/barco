<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <style>
      .hull { fill: #222222; stroke: #444444; stroke-width: 3; }
      .cavity { fill: #0f0f0f; stroke: #666666; stroke-width: 3; }
      .mount-hole { fill: #111111; stroke: #666666; stroke-width: 2; }
    </style>
  </defs>

  <g transform="translate(50, 0)">
    <!-- Contorno exterior del casco (Hull) sin la tobera -->
    <path class="hull" d="
      M 825,110 
      L 290,110 
      C 130,110 40,190 40,300 
      C 40,410 130,490 290,490 
      L 825,490 
      Z" />

    <!-- Compartimento interior (Cavidad / Slot para componentes) -->
    <rect class="cavity" x="300" y="150" width="480" height="300" rx="4" ry="4" />

    <!-- Detalles de montaje y pestillo delantero -->
    <path class="mount-hole" d="M 255,285 L 280,285 C 285,285 285,315 280,315 L 255,315 Z" />
    <circle cx="265" cy="300" r="4" fill="#666" />

    <!-- Orificios de tornillos en popa -->
    <circle class="mount-hole" cx="800" cy="190" r="5" />
    <circle class="mount-hole" cx="800" cy="410" r="5" />
  </g>
</svg>